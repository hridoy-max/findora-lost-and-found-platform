[project]
name = "findora-platform"
version = "0.1.0"
description = "Findora Lost and Found Platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "python-dotenv",
    "email-validator",
    "PyJWT",
    "passlib[bcrypt]",
    "bcrypt",
    "alembic",
    "slowapi",
    "httpx",
    "pytest",
    "python-multipart",
]

[tool.vercel]
entrypoint = "Backend.app:app"
